<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  /* theme-aware: follows the browser color scheme the same way Streamlit's
     auto theme does, so the input is never white-on-white on a light page */
  :root {
    --fg: #31333f; --muted: rgba(60, 60, 67, 0.6); --panel: #ffffff;
    --border: rgba(0, 0, 0, 0.15); --input-bg: rgba(49, 51, 63, 0.06);
    --hover: rgba(228, 87, 46, 0.10); --act: rgba(228, 87, 46, 0.22);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #fafafa; --muted: rgba(250, 250, 250, 0.55); --panel: #1c2230;
      --border: rgba(128, 128, 128, 0.35); --input-bg: rgba(127, 143, 165, 0.12);
      --hover: rgba(228, 87, 46, 0.18); --act: rgba(228, 87, 46, 0.30);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
  }
  body { margin: 0; background: transparent; font-family: "Source Sans Pro", sans-serif; }
  .wrap { position: relative; }
  input {
    width: 100%; box-sizing: border-box; padding: 9px 12px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--input-bg); color: var(--fg);
    font-size: 14.5px; outline: none;
  }
  input:focus { border-color: #e4572e; }
  input::placeholder { color: var(--muted); }
  #list {
    position: absolute; top: 40px; left: 0; right: 0; z-index: 5;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; box-shadow: var(--shadow);
  }
  .item { padding: 6px 12px; font-size: 13.5px; color: var(--fg); cursor: pointer;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { color: var(--muted); margin-left: 6px; }
  .item:hover { background: var(--hover); }
  .item.act { background: var(--act); }
  .none { padding: 10px 12px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <input id="q" autocomplete="off" spellcheck="false"/>
  <div id="list"></div>
</div>
<!-- written by dashboard/app.py each session: window.AC_OPTIONS / AC_PLACEHOLDER -->
<script src="data.js"></script>
<script>
  const send = (type, data) => window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  const setH = (h) => send("streamlit:setFrameHeight", { height: h });
  const setValue = (v) => send("streamlit:setComponentValue", { value: v, dataType: "json" });
  send("streamlit:componentReady", { apiVersion: 1 });
  // if the host streams render events, prefer the fresh args from Python
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || !d.isStreamlitMessage || d.type !== "streamlit:render") return;
    if (d.args && d.args.options) {
      window.AC_OPTIONS = d.args.options;
      document.getElementById("q").placeholder = d.args.placeholder || window.AC_PLACEHOLDER || "Search…";
      filter();
    }
  });

  const OPTS = () => window.AC_OPTIONS || [];
  const norm = (s) => (s || "").toString().toUpperCase();
  let hits = [], active = -1, lastSent = null, collapsed = false;
  const IN_H = 44, ROW_H = 31, PAD = 6;

  function filter() {
    collapsed = false;   // any keystroke reopens the list
    const q = norm(document.getElementById("q").value.trim());
    hits = [];
    if (q) {
      const pfx = [], sub = [];
      for (const o of OPTS()) {
        const t = norm(o.t), l = norm(o.label);
        if (t.startsWith(q) || l.startsWith(q)) pfx.push(o);
        else if (t.includes(q) || l.includes(q)) sub.push(o);
      }
      hits = pfx.concat(sub).slice(0, 8);
    }
    // blank field -> no suggestions at all, panel collapses to the input
    active = hits.length ? 0 : -1;
    render();
  }

  function render() {
    const L = document.getElementById("list");
    L.innerHTML = "";
    if (collapsed) { setH(IN_H); return; }
    if (!hits.length) {
      if (norm(document.getElementById("q").value.trim())) {
        const n = document.createElement("div");
        n.className = "none";
        n.textContent = "No match — try the ticker (e.g. ORCL)";
        L.appendChild(n);
        setH(IN_H + PAD + 34);
      } else {
        setH(IN_H);
      }
      return;
    }
    hits.forEach((o, i) => {
      const d = document.createElement("div");
      d.className = "item" + (i === active ? " act" : "");
      const b = document.createElement("b"); b.textContent = o.t;
      const s = document.createElement("small"); s.textContent = o.label;
      d.appendChild(b); d.appendChild(s);
      d.onclick = () => choose(o);
      d.onmousemove = () => { if (active !== i) { active = i; render(); } };
      L.appendChild(d);
    });
    setH(IN_H + PAD + hits.length * ROW_H);
  }

  function choose(o) {
    document.getElementById("q").value = o.t;
    // hide the list on pick: show only the input with the chosen ticker
    hits = []; active = -1; collapsed = true;
    render();
    document.getElementById("q").blur();
    if (lastSent !== o.t) { lastSent = o.t; setValue(o.t); }
  }

  const qEl = document.getElementById("q");
  qEl.placeholder = window.AC_PLACEHOLDER || "Type a ticker or name…";
  qEl.addEventListener("input", filter);
  qEl.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { active = Math.min(active + 1, hits.length - 1); render(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); render(); e.preventDefault(); }
    else if (e.key === "Enter") { if (hits[active]) choose(hits[active]); e.preventDefault(); }
    else if (e.key === "Escape") { qEl.value = ""; collapsed = true; render(); qEl.blur(); }
  });
  filter();
</script>
</body>
</html>
